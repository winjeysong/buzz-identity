[workspace]
members = ["fork-core"]

[package]
name = "buzz-identity"
version = "0.1.4"
description = "Local Artpal Buzz identity and knowledge fork client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "buzz_identity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bech32 = "0.12"
fork-core = { path = "fork-core" }
secp256k1 = { version = "0.31", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
zeroize = "1"
