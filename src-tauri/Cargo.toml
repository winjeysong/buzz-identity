[package]
name = "buzz-identity"
version = "0.1.1"
description = "Local Artpal Buzz and Nostr identity generator"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "buzz_identity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bech32 = "0.12"
secp256k1 = { version = "0.31", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
zeroize = "1"
