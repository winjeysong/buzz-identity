name: 构建分身运行时镜像

on:
  push:
    branches:
      - main
    paths:
      - "runtime/**"
      - ".github/workflows/runtime-image.yml"
  workflow_dispatch:

jobs:
  image:
    name: 构建并推送 buzz-fork-hermes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: crpi-fz0dnre7t4yztz62.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: runtime
          push: true
          tags: |
            crpi-fz0dnre7t4yztz62.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/buzz-fork-hermes:latest
            crpi-fz0dnre7t4yztz62.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/buzz-fork-hermes:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
